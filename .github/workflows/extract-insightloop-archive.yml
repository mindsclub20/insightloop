name: Extract InsightLoop archive
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-insightloop-archive.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Safely inspect and extract archive
        shell: bash
        run: |
          set -euo pipefail
          test -f insightloop-mvp.zip || { echo "ERROR: insightloop-mvp.zip not found at repository root"; exit 1; }
          python3 - <<'PY'
          import os, re, shutil, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path("insightloop-mvp.zip")
          work = Path("/tmp/insightloop-extract")
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True)
          required = {"package.json", "src", "public", "migrations", "supabase", "mobile", "test"}
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              bad = []
              for n in names:
                  p = PurePosixPath(n)
                  if p.is_absolute() or ".." in p.parts or (p.parts and ":" in p.parts[0]):
                      bad.append(n)
              if bad:
                  print("ERROR: unsafe archive paths detected; refusing extraction:", bad[:10])
                  sys.exit(1)
              roots = {PurePosixPath(n).parts[0] for n in names if PurePosixPath(n).parts}
              if roots != {"insightloop"}:
                  print("ERROR: expected one top-level 'insightloop/' directory; found:", sorted(roots))
                  sys.exit(1)
              missing = required - {PurePosixPath(n).parts[1] for n in names if len(PurePosixPath(n).parts) > 1}
              if missing:
                  print("ERROR: archive is missing expected project entries:", sorted(missing))
                  sys.exit(1)
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  if any(part in {"node_modules", ".git"} for part in p.parts):
                      continue
                  if p.name == ".env" or (p.name.startswith(".env.") and p.name != ".env.example"):
                      print("ERROR: environment/secret file in archive; refusing to commit:", info.filename)
                      sys.exit(1)
              z.extractall(work)
          source = work / "insightloop"
          secret_patterns = [
              ("private key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("GitHub token", re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("live secret key", re.compile(r"\b(?:sk_live_|rk_live_)[A-Za-z0-9]{16,}\b")),
          ]
          found = []
          for f in source.rglob("*"):
              if not f.is_file() or f.name == ".env.example":
                  continue
              if f.suffix.lower() in {".png",".jpg",".jpeg",".gif",".webp",".ico",".pdf",".zip",".apk",".db",".sqlite"}:
                  continue
              try:
                  text = f.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in secret_patterns:
                  if pattern.search(text):
                      found.append((str(f.relative_to(source)), label))
          if found:
              print("ERROR: possible secrets detected; no project files were copied or committed:")
              for path, label in found[:30]:
                  print(f"  {path}: {label}")
              sys.exit(1)
          # Copy archive contents into repository root, preserving the project layout.
          for item in source.iterdir():
              target = Path(item.name)
              if target.exists():
                  if target.is_dir() and item.is_dir():
                      shutil.copytree(item, target, dirs_exist_ok=True)
                  elif target.is_file() and item.is_file():
                      shutil.copy2(item, target)
                  else:
                      print("ERROR: path type conflict at", target)
                      sys.exit(1)
              else:
                  if item.is_dir():
                      shutil.copytree(item, target)
                  else:
                      shutil.copy2(item, target)
          # Ensure the minimum required ignore rules are present without replacing existing rules.
          gi = Path(".gitignore")
          current = gi.read_text(encoding="utf-8") if gi.exists() else ""
          required_rules = ["node_modules/", "data/*.db", "data/*.db-*", "*.log", ".env", "mobile/.env"]
          missing_rules = [rule for rule in required_rules if rule not in current.splitlines()]
          if missing_rules:
              with gi.open("a", encoding="utf-8") as out:
                  if current and not current.endswith("\n"):
                      out.write("\n")
                  out.write("\n# Required local data and secret exclusions\n")
                  out.write("\n".join(missing_rules) + "\n")
              print("Updated .gitignore with missing required exclusions:", ", ".join(missing_rules))
          print("Archive inspected and extracted. Top-level project entries:")
          for item in sorted(Path(".").iterdir(), key=lambda p: p.name.lower()):
              if item.name not in {".git", ".github"}:
                  print(("DIR  " if item.is_dir() else "FILE ") + item.name)
          print("Source files copied; source code was not edited.")
          PY
      - name: Commit extracted project files
        shell: bash
        run: |
          set -euo pipefail
          rm -f insightloop-mvp.zip .github/workflows/extract-insightloop-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Staged change summary:"
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "ERROR: no extracted project changes to commit"
            exit 1
          fi
          git commit -m "Extract InsightLoop project archive"
          git push origin HEAD:main
      - name: Verify repository contents
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -d src
          test -d public
          test -d migrations
          test -d supabase
          test -d mobile
          test -d test
          test ! -f insightloop-mvp.zip
          echo "VERIFIED: required project paths exist and archive was removed."
          git status --short
          git log -1 --oneline
