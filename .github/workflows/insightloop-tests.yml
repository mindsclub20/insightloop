name: InsightLoop tests

on:
  push:
    branches:
      - main
      - fix/neon-production-storage
      - fix/supabase-auth-persistent-storage
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify JavaScript syntax
        run: |
          find src test public/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run complete test suite
        run: npm test
