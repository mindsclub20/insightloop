name: InsightLoop CI

on:
  push:
    branches: [main, feature/anvesh-frontend-integration-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Check required project files
        run: |
          test -f package.json
          test -f src/server.js
          test -f public/index.html
          test -d test
      - name: Run automated tests
        run: npm test

  atomic-token-submission:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anvesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anvesh_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Create isolated minimal schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d anvesh_test -v ON_ERROR_STOP=1 -f test/sql/atomic-token-submission-fixture.sql
      - name: Apply atomic token submission migration to isolated database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d anvesh_test -v ON_ERROR_STOP=1 -f migrations/026_atomic_token_survey_submission.sql
      - name: Verify reward, duplicate, rollback and flagged-response behavior
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d anvesh_test -v ON_ERROR_STOP=1 -f test/sql/atomic-token-submission-assertions.sql
