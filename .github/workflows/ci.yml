name: InsightLoop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Check required project files
        run: |
          test -f package.json
          test -f src/server.js
          test -f public/index.html
          test -d test
      - name: Run automated tests
        run: npm test
