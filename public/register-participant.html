<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Anvesh</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/index.html">Anvesh</a></header>
<div class="narrow">
<h1>Join as a participant</h1>
<p class="muted">Participants must be 18 or older. Your account and profile are stored in Supabase.</p>
<div id="alert" class="alert error hidden" role="alert"></div>
<form id="form">
<label for="full_name">Full name</label><input id="full_name" autocomplete="name" required>
<label for="email">Email</label><input type="email" id="email" autocomplete="email" required>
<label for="password">Password (min 8 characters)</label><input type="password" id="password" minlength="8" autocomplete="new-password" required>
<label for="date_of_birth">Date of birth</label><input type="date" id="date_of_birth" required>
<label for="age_range">Age range</label><select id="age_range"><option value="18-25">18–25</option><option value="26-35">26–35</option><option value="36-45">36–45</option><option value="46-60">46–60</option><option value="61-99">61+</option></select>
<label for="gender">Gender (optional)</label><select id="gender"><option value="">Prefer not to say</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select>
<label for="city">City</label><input id="city" required>
<label for="area">Area (optional)</label><input id="area">
<label for="occupation_category">Occupation</label><select id="occupation_category"><option value="student">Student</option><option value="salaried">Salaried professional</option><option value="self_employed">Self-employed</option><option value="homemaker">Homemaker</option><option value="other">Other</option></select>
<label for="interests">Interests (comma-separated)</label><input id="interests" placeholder="food, smartphones, fashion">
<button style="width:100%;margin-top:16px;">Create account</button>
</form>
</div>
<script src="/js/api.js"></script>
<script type="module">
import { registerParticipant } from '/js/supabase/auth.js';
document.getElementById('form').addEventListener('submit', async (event) => {
  event.preventDefault(); clearAlert('alert');
  try {
    const result = await registerParticipant({
      full_name: full_name.value.trim(), email: email.value.trim(), password: password.value,
      date_of_birth: date_of_birth.value, age_range: age_range.value, gender: gender.value || null,
      city: city.value.trim(), area: area.value.trim() || null, occupation_category: occupation_category.value,
      interests: interests.value.split(',').map((tag) => tag.trim().toLowerCase()).filter(Boolean),
    });
    if (result.needsEmailConfirmation) {
      showAlert('alert', 'Account created. Check your email to confirm it, then log in.', 'success');
    } else {
      showAlert('alert', 'Account created successfully. Log in to continue.', 'success');
    }
    document.getElementById('form').reset();
  } catch (error) { showAlert('alert', error.message || 'Could not create the account.'); }
});
</script>
</body>
</html>
