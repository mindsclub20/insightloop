<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Your Business — Anvesh</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/index.html">Anvesh</a></header>
<div class="narrow">
  <h1>Register your business</h1>
  <p class="muted">Your business starts as pending verification. You can sign in after confirming your email if confirmation is enabled.</p>
  <div id="alert" class="alert error hidden" role="alert"></div>
  <form id="form">
    <label for="full_name">Your name</label><input id="full_name" autocomplete="name" required>
    <label for="email">Work email</label><input type="email" id="email" autocomplete="email" required>
    <label for="password">Password (min 8 characters)</label><input type="password" id="password" minlength="8" autocomplete="new-password" required>
    <label for="legal_name">Business / brand name</label><input id="legal_name" required>
    <label for="city">City</label><input id="city" required>
    <label for="category">Category</label>
    <select id="category">
      <option value="food_beverage">Food &amp; Beverage</option><option value="retail">Retail</option>
      <option value="services">Services</option><option value="agency">Research/Marketing Agency</option><option value="other">Other</option>
    </select>
    <label for="gstin">GSTIN (optional)</label><input id="gstin">
    <button style="width:100%; margin-top:16px;">Create business account</button>
  </form>
</div>
<script src="/js/api.js"></script>
<script type="module">
import { registerBusiness } from '/js/supabase/auth.js';
import { supabase } from '/js/supabase/client.js';
document.getElementById('form').addEventListener('submit', async (event) => {
  event.preventDefault(); clearAlert('alert');
  try {
    const result = await registerBusiness({
      full_name: full_name.value.trim(), email: email.value.trim(), password: password.value,
      legal_name: legal_name.value.trim(), city: city.value.trim(), category: category.value, gstin: gstin.value.trim() || null,
    });
    if (result.needsEmailConfirmation) {
      showAlert('alert', 'Account created. Confirm your email, then log in. Business setup will finish securely after confirmation.', 'success');
      document.getElementById('form').reset();
    } else if (result.businessSetupPending) {
      showAlert('alert', 'Your account was created, but business setup could not finish yet. Please log in to retry setup; do not register again.');
      document.getElementById('form').reset();
    } else {
      const { error } = await supabase.auth.getUser();
      if (error) throw error;
      location.href = '/supabase-business/dashboard.html';
    }
  } catch (error) {
    const code = error?.code || '';
    const message = error?.message || '';
    if (code === 'over_email_send_rate_limit' || /over_email_send_rate_limit|email rate limit/i.test(message)) {
      showAlert('alert', 'Email confirmation is temporarily rate-limited. Please wait before trying again; repeated submissions will not speed it up.');
    } else {
      showAlert('alert', message || 'Could not create the account.');
    }
  }
});
</script>
</body>
</html>
