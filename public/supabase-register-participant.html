<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join Anvesh</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="narrow"><h1>Join Anvesh as a participant</h1><p>Participants must be 18 or older.</p><form id="f"><label>Name</label><input id="full_name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><label>Date of birth</label><input id="date_of_birth" type="date" required><label>City</label><input id="city" required><label>Age range</label><select id="age_range"><option>18-24</option><option>25-34</option><option>35-44</option><option>45-54</option><option>55-120</option></select><button>Create account</button></form><script type="module">import {registerParticipant} from "/js/supabase/auth.js";document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();try{await registerParticipant({full_name:full_name.value,email:email.value,password:password.value,date_of_birth:date_of_birth.value,city:city.value,age_range:age_range.value});location.href="/supabase-participant/dashboard.html"}catch(e){alert(e.message)}})</script></main></body></html>
