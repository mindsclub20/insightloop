<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Anvesh</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/index.html">Anvesh</a></header>
<div class="narrow">
  <h1>Log in</h1>
  <div id="alert" class="alert error hidden" role="alert"></div>
  <form id="loginForm">
    <label for="email">Email</label><input type="email" id="email" autocomplete="email" required>
    <label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required>
    <button style="width:100%; margin-top:16px;">Log in</button>
  </form>
  <p class="muted" style="margin-top:12px;"><a href="#" id="forgotPasswordLink">Forgot password?</a></p>
  <p class="muted" style="margin-top:16px;">
    New business? <a href="/register-business.html">Register your business</a><br>
    New participant? <a href="/register-participant.html">Sign up to participate</a>
  </p>
</div>
<script src="/js/api.js"></script>
<script type="module">
import { login, getCurrentUserAndProfile, requestPasswordReset } from '/js/supabase/auth.js';
import { ensureBusinessCreatedForLogin } from '/js/supabase/business-onboarding.js';
import { syncUserInterests } from '/js/supabase/pending-interests.js';
import { supabase } from '/js/supabase/client.js';

document.getElementById('forgotPasswordLink').addEventListener('click', async (event) => {
  event.preventDefault();
  clearAlert('alert');
  const email = document.getElementById('email').value.trim();
  if (!email) { showAlert('alert', 'Enter your account email above first.'); document.getElementById('email').focus(); return; }
  const link = document.getElementById('forgotPasswordLink');
  link.textContent = 'Sending reset link…'; link.setAttribute('aria-disabled', 'true');
  try {
    await requestPasswordReset(email);
    showAlert('alert', 'If an account exists for that email, a password reset link has been sent. Check your inbox.', 'success');
  } catch (error) {
    showAlert('alert', error.message || 'Could not request a password reset.');
  } finally {
    link.textContent = 'Forgot password?'; link.removeAttribute('aria-disabled');
  }
});

document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  clearAlert('alert');
  try {
    await login(document.getElementById('email').value.trim(), document.getElementById('password').value);
    const { user, profile } = await getCurrentUserAndProfile();
    if (!profile || profile.status === 'SUSPENDED') {
      await supabase.auth.signOut();
      throw new Error('This account is not active. Contact Anvesh support.');
    }
    if (user && profile.role === 'BUSINESS') {
      const setup = await ensureBusinessCreatedForLogin(supabase, user);
      if (!setup.ready) {
        // Authentication succeeded. Keep the session so the user does not
        // mistake a provisioning outage for invalid credentials or re-register.
        showAlert('alert', 'You are signed in, but business setup is still pending. Please retry shortly; do not create another account.');
        console.error('Business onboarding remains pending after successful login.', setup.error);
        return;
      }
    }
    if (user) {
      try { await syncUserInterests(window.localStorage, user, supabase); }
      catch (syncError) {
        console.error('Interest sync will retry on the participant dashboard.', syncError);
      }
    }
    if (profile.role === 'BUSINESS') location.href = '/supabase-business/dashboard.html';
    else if (profile.role === 'ADMIN' || profile.role === 'SUPER_ADMIN') location.href = '/supabase-admin/dashboard.html';
    else location.href = '/supabase-participant/dashboard.html';
  } catch (error) {
    const code = error?.code || '';
    const message = error?.message || '';
    if (code === 'over_email_send_rate_limit' || /over_email_send_rate_limit|email rate limit/i.test(message)) {
      showAlert('alert', 'Email confirmation is temporarily rate-limited. Please wait before trying again; repeated submissions will not speed it up.');
    } else {
      showAlert('alert', message || 'Could not sign in.');
    }
  }
});
</script>
</body>
</html>
