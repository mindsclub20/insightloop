<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm email — InsightLoop</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
  main{max-width:520px;width:100%;padding:28px;border:1px solid #ddd;border-radius:16px;background:#fff}
  #status{margin:16px 0;padding:12px;border-radius:8px;background:#f4f4f5}
  a{display:inline-block;margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>Confirm your email</h1>
  <p id="status" role="status" aria-live="polite">Checking your confirmation link…</p>
  <a id="login" href="/login.html" hidden>Continue to login</a>
</main>
<script type="module">
import { supabase } from '/js/supabase/client.js';
import { persistPendingInterests } from '/js/supabase/interests.js';

const status = document.getElementById('status');
const login = document.getElementById('login');

function showError(message) {
  status.textContent = message;
  login.hidden = false;
}

async function finishConfirmation(user) {
  try {
    await persistPendingInterests(supabase, user);
    status.textContent = 'Email confirmed successfully! Your profile preferences are saved. You can now log in to InsightLoop.';
  } catch {
    // Verification has succeeded even if a secondary profile write fails.
    // Do not tell the user that the email confirmation itself failed.
    status.textContent = 'Email confirmed successfully. Some profile preferences could not be saved; you can continue to login.';
  }
  login.hidden = false;
  window.history.replaceState({}, document.title, window.location.pathname);
}

try {
  const params = new URLSearchParams(window.location.search);
  const tokenHash = params.get('token_hash');
  const type = params.get('type');

  if (tokenHash && type) {
    if (!['email', 'signup', 'magiclink', 'invite', 'email_change', 'recovery'].includes(type)) {
      showError('This confirmation link has an unsupported verification type. Request a new confirmation email.');
    } else {
      const { data, error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type });
      if (error) {
        showError(error.message || 'We could not verify this email. The link may have expired or already been used. Request a new confirmation email.');
      } else {
        await finishConfirmation(data.user);
      }
    }
  } else {
    // Supabase's standard ConfirmationURL flow usually returns with a PKCE
    // code or access-token fragment, not token_hash query parameters.
    // createClient({ detectSessionInUrl: true }) processes that callback.
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error) throw error;
    if (session?.user) {
      await finishConfirmation(session.user);
    } else {
      showError('This confirmation link is missing its verification session. Open the latest email or request a new confirmation link.');
    }
  }
} catch (error) {
  showError(error?.message || 'Verification failed. Please request a new confirmation email.');
}
</script>
</body>
</html>
