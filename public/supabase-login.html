<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Anvesh</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/index.html">Anvesh</a>
</header>

<div class="narrow">
  <h1>Log in</h1>
  <p class="muted">One login for participants, businesses, and administrators. You'll be sent to the correct dashboard automatically.</p>
  <div id="alert" class="alert error hidden" role="alert" aria-live="polite"></div>
  <form id="loginForm">
    <label for="username">Email or admin username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button id="loginButton" style="width:100%; margin-top:16px;">Log in</button>
  </form>
  <p class="muted" style="margin-top:16px;">
    New business? <a href="/supabase-register-business.html">Register your business</a><br>New participant? <a href="/supabase-register-participant.html">Create a participant account</a>
  </p>
</div>

<script type="module">
import { login, getCurrentUserAndProfile } from '/js/supabase/auth.js';
const form = document.getElementById('loginForm');
const button = document.getElementById('loginButton');
const alertBox = document.getElementById('alert');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  alertBox.textContent = '';
  alertBox.classList.add('hidden');
  button.disabled = true;
  button.textContent = 'Signing in…';
  try {
    const identifier = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    // Supabase Auth uses email/password. Keep the owner's requested username
    // as an alias; all other account types use their registered email.
    const email = identifier.toLowerCase() === 'shyamsundar'
      ? 'bvshyam7777@gmail.com'
      : identifier;
    if (!email.includes('@')) {
      throw new Error('Enter your registered email address. The admin username is also accepted.');
    }

    await login(email, password);
    const { user, profile } = await getCurrentUserAndProfile();
    if (!user) throw new Error('Sign-in did not create a session. Please try again.');
    if (!profile) throw new Error('Your account profile is missing. Contact support; no role was guessed.');
    if (String(profile.status || 'ACTIVE').toUpperCase() === 'SUSPENDED') {
      throw new Error('This account is suspended. Contact the administrator.');
    }

    const role = String(profile.role || '').toUpperCase();
    if (role === 'ADMIN' || role === 'SUPER_ADMIN') {
      window.location.replace('/supabase-admin/dashboard.html');
    } else if (role === 'BUSINESS') {
      window.location.replace('/supabase-business/dashboard.html');
    } else if (role === 'USER') {
      window.location.replace('/supabase-participant/dashboard.html');
    } else {
      throw new Error('Your account role is not recognised. Contact support.');
    }
  } catch (error) {
    alertBox.textContent = error?.message || 'Login failed. Please try again.';
    alertBox.classList.remove('hidden');
  } finally {
    button.disabled = false;
    button.textContent = 'Log in';
  }
});
</script>
</body>
</html>
