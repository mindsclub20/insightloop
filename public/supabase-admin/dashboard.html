<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Anvesh (Supabase)</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/supabase-admin/dashboard.html">Anvesh Admin</a>
  <nav>
    <span id="userName" class="muted"></span>
    <a href="/supabase-admin/tokens.html">Token control</a>
    <a href="#" onclick="logoutSupabase()">Log out</a>
  </nav>
</header>

<div class="container">
  
  <div id="statsBar" class="grid cols-2" style="grid-template-columns: repeat(4, 1fr);"></div>

  <div class="tabs">
    <button class="tab active" type="button" data-tab="studies">Studies</button>
    <button class="tab" type="button" data-tab="responses">Survey Responses</button>
    <button class="tab" type="button" data-tab="flagged">Flagged Responses</button>
    <button class="tab" type="button" data-tab="businesses">Businesses</button>
  </div>

  <div id="alert" class="alert error hidden"></div>

  <section id="tab-studies"><div id="studiesList"></div></section>
  <section id="tab-responses" class="hidden"><div id="responsesList"></div></section>
  <section id="tab-flagged" class="hidden"><div id="flaggedList"></div></section>
  <section id="tab-businesses" class="hidden"><div id="businessList"></div></section>
</div>

<script src="/js/api.js"></script>
<script type="module" src="/js/supabase/admin-page.js"></script>
</body>
</html>
