<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Anvesh</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/admin/dashboard.html">Anvesh Admin</a>
  <nav aria-label="Account navigation">
    <span id="userName" class="muted"></span>
    <a href="#" onclick="logout()">Log out</a>
  </nav>
</header>

<div class="container app-workspace"><div class="workspace-intro"><p class="section-kicker">PLATFORM OPERATIONS</p><h1>Platform overview</h1><p class="section-lead">Review platform activity and manage authorized administration workflows.</p></div>
  <div id="statsBar" class="grid cols-2" style="grid-template-columns: repeat(4, 1fr);"></div>

  <div class="tabs">
    <div class="tab active" data-tab="studies">Studies</div>
    <div class="tab" data-tab="flagged">Flagged Responses</div>
    <div class="tab" data-tab="businesses">Businesses</div>
    <div class="tab" data-tab="users">Users</div>
    <div class="tab" data-tab="withdrawals">Withdrawals</div>
    <div class="tab" data-tab="ledger">Ledger Audit</div>
  </div>

  <div id="alert" class="alert error hidden"></div>

  <section id="tab-studies"><div id="studiesList"></div></section>
  <section id="tab-flagged" class="hidden"><div id="flaggedList"></div></section>
  <section id="tab-businesses" class="hidden"><div id="businessList"></div></section>
  <section id="tab-users" class="hidden"><div id="usersList"></div></section>
  <section id="tab-withdrawals" class="hidden"><div id="withdrawalsList"></div></section>
  <section id="tab-ledger" class="hidden"><div id="ledgerArea"></div></section>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>

<script>
(() => {
  const tablist = document.querySelector('.tabs');
  if (!tablist) return;
  tablist.setAttribute('role', 'tablist');
  tablist.setAttribute('aria-label', 'Workspace sections');
  const tabs = [...tablist.querySelectorAll('.tab')];
  tabs.forEach((tab, index) => {
    tab.setAttribute('role', 'tab');
    tab.setAttribute('tabindex', tab.classList.contains('active') ? '0' : '-1');
    tab.setAttribute('aria-selected', tab.classList.contains('active') ? 'true' : 'false');
    tab.addEventListener('click', () => syncTabs());
    tab.addEventListener('keydown', event => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      event.preventDefault();
      const current = tabs.indexOf(tab);
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 :
        (current + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      tabs[next].focus();
      tabs[next].click();
    });
  });
  function syncTabs() {
    tabs.forEach(tab => {
      const active = tab.classList.contains('active');
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
      tab.setAttribute('tabindex', active ? '0' : '-1');
    });
  }
  const observer = new MutationObserver(syncTabs);
  tabs.forEach(tab => observer.observe(tab, {attributes:true, attributeFilter:['class']}));
})();
</script>

</body>
</html>
